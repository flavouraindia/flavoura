<script>
/* Reads /blog/posts.json and builds a card for every post, newest first. */
fetch('/blog/posts.json').then(r=>r.json()).then(function(posts){
  posts.sort(function(a,b){return b.date.localeCompare(a.date)});
  var box=document.getElementById('posts'); box.textContent='';
  posts.forEach(function(p){
    var a=document.createElement('a'); a.className='card'; a.href='/blog/'+p.slug;
    [['tag',p.tag,'span'],['','' ,'h2'],['',p.excerpt,'p'],['meta',p.date_h+' · '+p.read,'span'],['more','Read article →','span']].forEach(function(x){
      var e=document.createElement(x[2]); if(x[0])e.className=x[0]; e.textContent=x[2]==='h2'?p.title:x[1]; a.appendChild(e);
    });
    box.appendChild(a);
  });
}).catch(function(){document.getElementById('posts').innerHTML='<p>Articles could not be loaded. Please refresh.</p>';});
</script>
